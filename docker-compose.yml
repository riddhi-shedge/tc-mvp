# Local, hosted-style staging — SYNTHETIC ONLY. Reads secrets from .env
# (gitignored); the gates below stay closed so nothing real is processed/sent.
#   docker compose up --build
services:
  api:
    build:
      context: ./backend
    ports:
      - "8000:8000"
    env_file: .env
    environment:
      SYNTHETIC_ONLY: "true"
      SEND_ENABLED: "false"
      CA_RULES_VERIFIED: "true"
      FRONTEND_ORIGIN: "http://localhost:5173"
      PORT: "8000"

  frontend:
    image: node:20-slim
    working_dir: /app
    volumes:
      - ./frontend:/app
    command: sh -c "npm ci && npm run build && npm run preview -- --host 0.0.0.0 --port 5173"
    ports:
      - "5173:5173"
    environment:
      VITE_API_BASE: "http://localhost:8000"
    depends_on:
      - api
