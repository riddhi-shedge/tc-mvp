# Render blueprint — one-click deploy after connecting the GitHub repo.
# Secrets are NOT in this file (sync: false = fill them in the Render
# dashboard, values from your local .env — see docs/deploy-runbook.md).
services:
  - type: web
    name: terra-backend
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /openapi.json
    envVars:
      - key: PYTHON_VERSION
        value: "3.13"
      - key: APP_ENV
        value: production
      - key: CA_RULES_VERIFIED
        value: "true"
      - key: REQUIRE_MFA
        value: "true"
      - key: FRONTEND_ORIGIN
        fromService: { type: web, name: terra-frontend, property: host }   # prefix https:// in dashboard if needed
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: POSTMARK_SERVER_TOKEN
        sync: false
      - key: POSTMARK_WEBHOOK_TOKEN
        generateValue: true          # fresh production token (put in Postmark too)
      - key: POSTMARK_INBOUND_ADDRESS
        sync: false
      - key: POSTMARK_FROM_EMAIL
        sync: false
      - key: COMPLIANCE_SERVICE_TOKEN
        generateValue: true          # fresh; cron below shares it via env group if split later
      - key: SYNTHETIC_ONLY
        sync: false                  # "false" ONLY with ZDR_CONFIRMED=true (runbook B5)
      - key: ZDR_CONFIRMED
        sync: false
      - key: SEND_ENABLED
        sync: false
      - key: SEND_ALLOWLIST
        sync: false
      - key: TC_NAME
        sync: false
      - key: GOOGLE_MAPS_API_KEY
        sync: false
      - key: RENTCAST_API_KEY
        sync: false

  - type: web
    name: terra-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_BASE
        fromService: { type: web, name: terra-backend, property: host }    # prefix https:// in dashboard
      - key: VITE_SUPABASE_URL
        sync: false
      - key: VITE_SUPABASE_ANON_KEY
        sync: false
